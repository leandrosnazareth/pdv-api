services:
  mysql:
    image: mysql:8.0.29
    container_name: pdv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pdvdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: maven:3.8.8-eclipse-temurin-17
    container_name: pdv-api
    restart: unless-stopped
    working_dir: /app
    command: ./mvnw spring-boot:run
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pdvdb?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    volumes:
      - .:/app
      - maven_cache:/root/.m2
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  maven_cache:
